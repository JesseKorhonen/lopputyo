<ion-header>
  <ion-toolbar>
    <ion-title>
      Rekisteröidy
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="login">
  <form (ngSubmit)="onSubmit(f.value, f.valid)" #f="ngForm">
    <ion-item>
      <ion-label position="floating">Käyttäjätunnus</ion-label>
      <ion-input type="text" ngModel name="username" required placeHolder="Käyttäjätunnus"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating"> Salasana</ion-label>
      <ion-input type="password" ngModel name="password" required placeHolder="Salasana"></ion-input>
    </ion-item>
    <ion-button type="submit" [disabled]="!f.valid">Rekisteröidy</ion-button>
  </form>
</ion-content>
